<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VSPARK Prompt Engineering | Participant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7bff'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'%3EV%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="container">
      <a class="brand" href="/">
        <span class="brand-mark">V</span>
        <span class="brand-text">SPARK<small>Prompt Engineering</small></span>
      </a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <button class="btn ghost sm" id="logoutBtn" type="button" hidden>Log out</button>
      </nav>
    </div>
  </header>

  <main class="portal-wrap">
    <div class="container" style="max-width:720px">
      <form class="card" id="loginView" style="padding:32px" novalidate>
        <span class="kicker">VSPARK Prompt Engineering</span>
        <h1 style="font-size:1.6rem;margin-top:8px">Participant login</h1>
        <p class="muted" style="margin:8px 0 20px">Use your Registration ID (VS-0007) and the registration number of either team member.</p>
        <div id="loginAlert" class="alert err" role="alert"></div>
        <div class="field"><label for="loginId">Registration ID</label><input id="loginId" placeholder="VS-0001" autocomplete="username" /></div>
        <div class="field" style="margin-top:14px"><label for="loginReg">Registration number</label><input id="loginReg" placeholder="FA23-BSE-062" /></div>
        <button class="btn" id="loginBtn" type="submit" style="margin-top:18px;width:100%">Sign in</button>
      </form>

      <div id="dashView" hidden></div>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
