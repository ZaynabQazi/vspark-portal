services:
  - type: web
    name: vspark-portal
    runtime: node
    plan: free
    # The app lives in a subfolder of the repo, so point Render at it.
    rootDir: visual-spark-portal
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: vspark
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: COMPETITION_MINUTES
        value: "20"
